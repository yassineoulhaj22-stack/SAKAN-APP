<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF8F5">
<title>Sakan</title>
<style>
:root{--p:#6C54FF;--bg:#FAF8F5;--ink:#14122B;--mu:#6B6880;--so:#EEEAFF;--g:#16A06B;--ln:#E9E6F2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,sans-serif;max-width:520px;margin:auto;padding-top:env(safe-area-inset-top)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,p{margin:0}
.scr{padding:14px 16px 100px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--mu)}.c{text-align:center}.pc{color:var(--p)}
small{font-size:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;margin-bottom:14px}
.pad{padding:14px}
.h1{font-size:22px;font-weight:800;margin:18px 0 8px}
.pill{display:inline-block;background:var(--so);color:var(--p);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}
.pill.g{background:#DFF7EA;color:var(--g)}.pill.o{background:#FFF1DC;color:#B45F06}.pill.w{background:#fff;color:var(--ink)}.pill.d{background:#14122Bcc;color:#fff}
.btn{display:block;width:100%;background:var(--p);color:#fff;font-weight:700;padding:16px;border-radius:16px;text-align:center;box-shadow:0 6px 14px #6C54FF55}
.btn.s{width:auto;padding:11px 14px;font-size:13px;border-radius:12px;box-shadow:none}
.btn.o{background:#fff;color:var(--p);border:1px solid var(--ln);box-shadow:none}
.ph{display:flex;align-items:center;justify-content:center;font-size:56px;border-radius:14px;opacity:.95}
.pw{position:relative;padding:8px}.tl{position:absolute;left:16px;top:16px;display:flex;gap:6px}
.hrt{position:absolute;right:16px;top:16px;background:#fff;border-radius:50%;width:36px;height:36px;font-size:17px}
.cmp{position:absolute;left:16px;bottom:16px;background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:600}
.pd{padding:6px 16px 16px}.pd h3{font-size:18px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tags span{background:#F2F0F7;color:var(--mu);font-size:11px;padding:4px 8px;border-radius:8px}
hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.price{font-size:22px;font-weight:800;color:var(--p)}.price small{color:var(--mu);font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{padding:9px 14px;border-radius:20px;background:#fff;border:1px solid var(--ln);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.logo{font-size:26px;font-weight:800}.logo b{color:var(--p)}
.bar{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:center;margin:12px 0}
.hero{background:linear-gradient(135deg,var(--so),#F6F3FF);border-radius:22px;padding:16px;display:flex;align-items:center;gap:6px}
.hero h2{font-size:20px;line-height:1.2;margin:8px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.city{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;text-align:left}
.city i{font-style:normal;background:var(--so);border-radius:12px;padding:8px;font-size:18px}
.tip{background:var(--so);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;margin:10px 0}
.tip b{color:var(--p)}.tip small{display:block;color:var(--mu)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 0;font-size:11px;color:var(--mu)}.nav button span{display:block;font-size:20px}.nav button.on{color:var(--p);font-weight:700}
.seg{display:flex;background:#F0EDF5;border-radius:14px;padding:4px}.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--mu);font-size:13px}.seg button.on{background:#fff;color:var(--p)}
.cbar{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.map{position:relative;height:520px;border-radius:18px;overflow:hidden;background:#F1EEE9;margin-top:12px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;background:#fff;border-radius:20px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 6px #0002}.pin.s{background:var(--p);color:#fff}
.mc{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:16px;padding:10px;display:flex;gap:10px;box-shadow:0 4px 14px #0003}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top h2{font-size:18px;flex:1}
.bk{background:#fff;border:1px solid var(--ln);border-radius:50%;width:38px;height:38px;font-size:18px}
.fix{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px #0001;z-index:5}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px}.kv small{display:block;color:var(--mu)}
.rw{display:flex;justify-content:space-between;background:#F5F3F8;border-radius:10px;padding:10px;margin-bottom:6px;font-size:14px}.rw b{color:var(--p);font-size:13px}
.day{flex:1;border:1px solid var(--ln);border-radius:14px;padding:10px 4px;text-align:center;background:#fff}.day.on{background:var(--p);color:#fff}.day small{display:block;opacity:.7}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.tg input{appearance:none;width:46px;height:26px;background:#d8d5e0;border-radius:20px;position:relative;flex:none}.tg input:checked{background:var(--p)}.tg input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg input:checked::after{left:23px}
textarea,input[type=text]{width:100%;border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit;background:#F8F6FF}
input[type=range]{width:100%;accent-color:var(--p)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;text-align:left}th{color:var(--p)}td:first-child{color:var(--mu)}
.onb{min-height:100vh;display:flex;flex-direction:column;padding:12px 24px 20px;background:#fff}.mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.mid h1{font-size:26px;font-weight:800;margin:24px 0 10px}.mid p{color:var(--mu);line-height:1.45}
.dots{display:flex;justify-content:center;gap:6px;margin-top:20px}.dots i{width:8px;height:8px;border-radius:8px;background:var(--ln)}.dots i.on{width:28px;background:var(--p)}
.lk{color:var(--mu);padding:10px;min-width:44px}
.mw{width:200px;height:200px;margin:auto}.mw.sm{width:60px;height:60px;overflow:hidden;flex:none;margin:0}.mw.sm .mas{transform:scale(.3);transform-origin:0 0}
.mas{position:relative;width:200px;height:200px}.mas i{position:absolute;display:block}
.mas .b{left:40px;top:20px;width:120px;height:105px;background:var(--p);border-radius:40px 60px 10px 40px}
.mas .e{width:26px;height:24px;background:#fff;border-radius:50%;top:58px}.mas .e::after{content:'';position:absolute;width:12px;height:12px;background:var(--ink);border-radius:50%;left:7px;bottom:2px}
.mas .l{width:28px;height:42px;background:var(--p);border-radius:6px 6px 16px 16px;top:128px}
.mas span{position:absolute;right:20px;bottom:40px;font-size:54px}
.msg{max-width:78%;padding:11px 14px;border-radius:18px;margin-bottom:10px;line-height:1.35;font-size:14px}.msg.me{background:var(--p);color:#fff;margin-left:auto}.msg.th{background:#fff;border:1px solid var(--ln)}.msg small{display:block;text-align:right;opacity:.7;font-size:10px}
.pgb{height:8px;background:var(--so);border-radius:8px;overflow:hidden}.pgb div{height:100%;background:var(--p)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const L=[
{id:0,t:'Studio moderne ensoleillé',loc:'Gauthier, Casablanca',p:4200,s:42,tr:'10 min Tramway',tags:['Wifi Fibre','Meublé','Balcon'],c:'#b8a58c',v:1,i:1},
{id:1,t:'Appartement Agdal Campus',loc:'Agdal, Rabat',p:3800,s:55,tr:'3 min Université',tags:['Proche Fac','Machine à laver','Gardiennage 24/7'],c:'#c9b6a4',v:1,i:1},
{id:2,t:'Bel Appartement Maarif',loc:'Maarif Extension, Casablanca',p:5800,s:78,tr:'2 min Busway',tags:['Garage sous-sol'],c:'#b9a7b8',v:0,i:0},
{id:3,t:'Bel appartement 2 pièces rénové',loc:'Yaakob el mansour, Rabat',p:3000,s:60,tr:'8 min tramway',tags:['2 ch','Étage 3 avec ascenseur'],c:'#d1c2ae',v:0,i:1},
{id:4,t:'Studio cosy tout équipé',loc:'Av. Al amal, Rabat',p:2300,s:35,tr:'3 min station',tags:['Studio meublé','Fibre incluse'],c:'#c4ae98',v:1,i:0},
{id:5,t:'Chambre spacieuse en colocation conviviale',loc:'Al irfan, Rabat',p:2500,s:18,tr:'10 min universités',tags:['Chambre privée 18 m²','Charges comprises','Coloc 3 pers.'],c:'#bbb3c9',v:0,i:0},
{id:6,t:'Superbe Studio Meublé – Quartier Al irfan',loc:'Av. Allal Al Fassi, Rabat 11000',p:2500,s:42,tr:'3 min à pied du Tramway Ibn Rochd',tags:['Smart TV 43"','Climatisation réversible','Lave-linge','Balcon sans vis-à-vis','Concierge & Caméras'],c:'#b7a894',v:1,i:1}];
const D=[['MER','15 Mai','3 créneaux','Mercredi'],['JEU','16 Mai','2 créneaux','Jeudi'],['SAM','18 Mai','5 créneaux','Samedi']],H=['11:00','14:30','17:00','18:30'];
const CH=['Je suis étudiant(e)','Quand emménager ?','Dossier complet disponible'],QR=["Je serai là à l'heure 👋",'Pouvez-vous m\'appeler ? 📞','Partager mon dossier'];
const TYPES=['Studio','F2 (1 Chambre)','F3 (2 Chambres)','Colocation','Chambre étudiante'];
const CRIT=[['Meublé & Équipé','Lit, bureau, électroménager inclus'],['Sans frais d\'agence','Direct propriétaire certifié'],['Disponibilité immédiate','Emménagement ce mois-ci'],['Vérifié par Sakan','Visité & validé par nos équipes terrain']];
let S={stack:[['onb',0]],favs:new Set([0,1,2]),cmp:new Set([0,1]),q:0,map:0,sort:0,fil:'Studio',v:{d:0,h:1,site:1},
 mt:"Bonjour Karim, ce studio m'intéresse beaucoup pour la rentrée universitaire. Est-il toujours libre à partir du 1er juin ? J'aimerais le visiter au créneau sélectionné.",
 msgs:[],f:{city:'Rabat',walk:10,min:1000,max:2500,types:['Studio','F2 (1 Chambre)','Colocation'],crit:[1,1,0,1]},fl:1};
const $=s=>document.querySelector(s),cur=()=>S.stack[S.stack.length-1];
const go=(n,a)=>{S.stack.push([n,a]);render()},back=()=>{if(S.stack.length>1)S.stack.pop();render()},root=n=>{S.stack=[[n]];render()};
const fav=i=>{S.favs.has(i)?S.favs.delete(i):S.favs.add(i);render(1)},tc=i=>{S.cmp.has(i)?S.cmp.delete(i):S.cmp.size<4&&S.cmp.add(i);render(1)};
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const mas=(it,sm)=>`<div class="mw ${sm?'sm':''}"><div class="mas"><i class="b"></i><i class="e" style="left:68px"></i><i class="e" style="left:104px"></i><i class="l" style="left:66px"></i><i class="l" style="left:108px"></i>${it?`<span>${it}</span>`:''}</div></div>`;
const ph=(l,h=190)=>`<div class="ph" style="height:${h}px;background:linear-gradient(135deg,${l.c},${l.c}88)">🛋️</div>`;
const tip=(t,x)=>`<div class="tip">${mas('',1)}<div><b>${t}</b><small>${x}</small></div></div>`;
const logo=`<span class="logo">🏠 <b style="color:var(--ink)">sakan</b></span>`;
const tb=t=>`<div class="top"><button class="bk" onclick="back()">←</button><h2>${t}</h2></div>`;
function card(l,c){return `<div class="card"><div class="pw">${ph(l)}<div class="tl">${l.i?pill('Dispo immédiate','g'):''}${l.v?pill('✔ Vérifié Sakan'):''}</div><button class="hrt" onclick="fav(${l.id})">${S.favs.has(l.id)?'💜':'🤍'}</button>${c?`<button class="cmp" onclick="tc(${l.id})">${S.cmp.has(l.id)?'☑':'☐'} Comparer</button>`:''}</div><div class="pd"><h3>${l.t}</h3><div class="muted" style="font-size:13px">📍 ${l.loc} (${l.tr})</div><div class="tags">${l.tags.slice(0,3).map(x=>`<span>${x}</span>`).join('')}</div><hr><div class="sp"><div><small class="muted">Loyer mensuel</small><div class="price">${l.p} DH <small>/ mois</small></div></div><button class="btn s" onclick="go('det',${l.id})">Voir détails →</button></div></div></div>`}
function cmpTable(a){a=a.slice(0,4);return `<table><tr><td>CRITÈRE</td>${a.map(l=>`<th>${l.loc.split(',')[0]}</th>`).join('')}</tr>`+[['Loyer mensuel',l=>l.p+' DH'],['Transports',l=>l.tr],['Surface nette',l=>l.s+' m²'],['Charges incluses',l=>l.tags[0]],['Disponibilité',l=>l.i?'Immédiate':'Sur demande']].map(r=>`<tr><td>${r[0]}</td>${a.map(l=>`<td><b>${r[1](l)}</b></td>`).join('')}</tr>`).join('')+'</table>'}
const SC={
onb:([i=0])=>{},
home:()=>`<div class="scr"><div class="sp">${logo}<span style="font-size:24px">🔔</span></div><div class="hero" style="margin-top:14px"><div>${pill('✔ 100% vérifié','w')}<h2>Trouve ton logement idéal en toute sérénité</h2><small class="muted">Zéro caution floue, trajets étudiants calculés.</small></div>${mas('',1)}</div><div class="bar" onclick="tab('search')"><span>🔍</span><span class="muted" style="flex:1">Ville, quartier, école ou tramway...</span><span class="pc">⚙</span></div><div class="chips">${['Studio','Colocation','Appartement meublé'].map(c=>`<button class="chip ${S.fil==c?'on':''}" onclick="S.fil='${c}';render(1)">${c}</button>`).join('')}</div><div class="sp"><h2 class="h1">Recommandés pour toi</h2><b class="pc" onclick="tab('search')">Voir tout</b></div><small class="muted">Vérifiés sur place par les ambassadeurs Sakan</small><div style="height:12px"></div>${card(L[0])}${card(L[1])}<h2 class="h1">Villes populaires</h2><div class="grid">${[['Casablanca','840+','🏢'],['Rabat','520+','🏛'],['Marrakech','390+','☀️'],['Tanger','270+','⛵']].map(c=>`<button class="city" onclick="tab('search')"><i>${c[2]}</i><span><b>${c[0]}</b><br><small class="muted">${c[1]} annonces</small></span></button>`).join('')}</div>${tip('Garantie Transparence Sakan','Contrats types, aucune commission cachée et visite vérifiée.')}</div>`,
search:()=>{let r=[L[3],L[4],L[5],L[6]];r=S.sort==0?r.sort((a,b)=>a.p-b.p):S.sort==1?r.reverse():r;return `<div class="scr"><div class="sp">${logo}<span style="font-size:24px">🔔</span></div><div class="bar" onclick="go('fil')"><span>🔍</span><b style="flex:1">${S.f.city}, Al irfan</b>${pill('⚙ (3) filtres')}</div><div class="seg"><button class="${S.map?'':'on'}" onclick="S.map=0;render(1)">☰ Liste</button><button class="${S.map?'on':''}" onclick="S.map=1;render(1)">🗺 Carte</button></div>${S.map?`<div class="map"><svg viewBox="0 0 400 520" preserveAspectRatio="none"><g stroke="#fff" stroke-width="14"><path d="M0 110l400-20M0 290l400-20M0 440l400-20M60 0l20 520M200 0l20 520M330 0l20 520"/></g><circle cx="290" cy="160" r="50" fill="#E3F0E5"/><path d="M340 20Q190 200 40 480" fill="none" stroke="#6C54FF" stroke-width="3" stroke-dasharray="10 8"/></svg><div class="pin" style="left:18px;top:30px;background:var(--so);font-size:11px">🎓 Faculté de Science de Rabat</div><div class="pin" style="left:55%;top:25%">3 800 DH</div><div class="pin" style="left:18%;top:42%">5 200 DH</div><div class="pin" style="left:62%;top:60%">4 200 DH</div><div class="pin s" style="left:38%;top:50%">★ 2 500 DH</div><div class="mc" onclick="go('det',6)"><div style="width:90px">${ph(L[6],80)}</div><div><div class="row">${pill('✔ Vérifié Sakan')}${pill('5 min Tram','w')}</div><b>Studio Moderne al irfan</b><br><small class="muted">Av. Allal Al Fassi, Rabat 11000</small><div class="price" style="font-size:18px">2 500 DH <small>/ mois</small></div></div></div></div>`:`<div class="sp"><h2 class="h1">48 logements disponibles <span style="color:var(--g)">●</span></h2></div><div class="chips"><small class="muted" style="align-self:center">Trier par :</small>${['Prix croissant','Plus récents','Proximité'].map((c,i)=>`<button class="chip ${S.sort==i?'on':''}" onclick="S.sort=${i};render(1)">${c}</button>`).join('')}</div><div style="height:8px"></div>${r.map(l=>card(l,1)).join('')}${tip('Astuce de Sakan','Utilisez le bouton Comparer pour évaluer 2 logements côte à côte.')}`}${S.cmp.size?`<div class="cbar" onclick="go('cmp')"><span>② Comparer (${S.cmp.size} logements)</span><span style="color:#CFC6FF;font-weight:400">Ouvrir l'analyse</span></div>`:''}</div>`},
fil:()=>{const f=S.f;return `<div class="scr"><div class="sp"><button class="bk" onclick="back()">✕</button><h2 style="flex:1;margin-left:10px;font-size:18px">Filtres de recherche</h2><b class="pc" onclick="S.f.walk=10;S.f.min=1000;S.f.max=2500;render(1)">Réinitialiser</b></div><div class="card pad" style="margin-top:14px"><b>🧭 Localisation & Trajet</b><div class="chips" style="margin:10px 0">${['Rabat','Casablanca','Tanger','Marrakech'].map(c=>`<button class="chip ${f.city==c?'on':''}" onclick="S.f.city='${c}';render(1)">${c}</button>`).join('')}</div><div class="bar" style="margin:0 0 10px;background:#F5F3F8">🎓 Faculté de Médecine et pharmacie</div><div class="sp"><span>🚶 Distance maximale à pied</span><b class="pc" id="wv">${f.walk} min max</b></div><input type="range" min="5" max="30" value="${f.walk}" oninput="S.f.walk=this.value;$('#wv').textContent=this.value+' min max'"></div><div class="card pad"><div class="sp"><b>💵 Budget mensuel (DH)</b>${pill('Toutes charges comprises')}</div><div class="sp" style="margin:10px 0"><b style="font-size:20px" id="mn">${f.min} DH</b><b style="font-size:20px" id="mx">${f.max} DH</b></div><input type="range" min="1000" max="15000" step="100" value="${f.min}" oninput="S.f.min=Math.min(this.value,S.f.max);$('#mn').textContent=S.f.min+' DH'"><input type="range" min="1000" max="15000" step="100" value="${f.max}" oninput="S.f.max=Math.max(this.value,S.f.min);$('#mx').textContent=S.f.max+' DH'"></div><div class="card pad"><b>🏢 Type de logement</b><div class="chips" style="flex-wrap:wrap;margin-top:10px">${TYPES.map((t,i)=>`<button class="chip ${f.types.includes(t)?'on':''}" onclick="tt(${i})">${f.types.includes(t)?'✓ ':''}${t}</button>`).join('')}</div></div><div class="card pad"><b>🎚 Critères essentiels</b>${CRIT.map((c,i)=>`<label class="tg"><span><b>${c[0]}</b><br><small class="muted">${c[1]}</small></span><input type="checkbox" ${f.crit[i]?'checked':''} onchange="S.f.crit[${i}]=this.checked?1:0"></label>`).join('')}</div>${tip('ASTUCE SAKAN','Active l\'alerte pour être notifié des nouveaux logements dès leur parution !')}<div class="fix"><button class="btn" onclick="back()">⚙ Afficher les 48 logements</button></div></div>`},
det:i=>{const l=L[i];return `<div style="position:relative"><div class="ph" style="height:280px;border-radius:0;background:linear-gradient(135deg,${l.c},${l.c}88)">🛋️</div><div class="sp" style="position:absolute;top:12px;left:12px;right:12px"><button class="bk" onclick="back()">←</button><div class="row"><button class="bk">⤴</button><button class="bk" onclick="fav(${l.id})">${S.favs.has(l.id)?'💜':'🤍'}</button></div></div><div class="sp" style="position:absolute;bottom:12px;left:12px;right:12px">${pill('● Disponibilité immédiate','w')}${pill('1 / 4 photos','d')}</div></div><div class="scr"><div class="tip" style="margin-top:0"><span style="font-size:32px">🏠</span><div><b>Certifié & Visité par Sakan ✔</b><small>Conforme aux photos, loyer et charges vérifiés.</small></div></div><h1 style="font-size:26px;margin:12px 0 6px">${l.t}</h1><div class="muted">📍 ${l.loc} · ${l.tr}</div><div class="card pad sp" style="margin-top:12px"><div><div class="price">${l.p} DH <small>/ mois</small></div><small style="color:var(--g)">✓ Charges & syndic compris</small></div><div style="text-align:right">${pill('Bail de 12 mois')}<br><small class="muted">Caution : 1 mois</small></div></div><h2 class="h1">Caractéristiques clés</h2><div class="kv"><div><small>Surface</small><b>${l.s} m²</b></div><div><small>Étage</small><b>3ème (Ascenseur)</b></div><div><small>Ameublement</small><b>Meublé avec goût</b></div><div><small>Connectivité</small><b>Wifi Fibre optique</b></div></div><h2 class="h1">Description du bien</h2><div class="card pad muted" style="line-height:1.5">Situé au cœur du quartier, dans un immeuble récent, sécurisé avec gardien 24/7 et ascenseur moderne. Ce logement lumineux baigne dans la lumière naturelle grâce à sa grande baie vitrée orientée sud-ouest.</div><h2 class="h1">Équipements inclus</h2><div class="row" style="flex-wrap:wrap">${l.tags.map(t=>pill(t,'w')).join('')}</div><h2 class="h1">Localisation & Trajets</h2><div class="card pad"><div class="ph" style="height:100px;background:#F1EEE9;font-size:30px">📍</div><b style="display:block;margin:10px 0 6px">Temps de trajet estimés :</b>${[['🚋 Tramway Ibn rochd','3 min à pied'],['🎓 Pôle Universitaire','14 min tram'],['🏙 Agdal','8 min taxi / 18 min pied'],['🛒 Supermarché & Commodités','2 min à pied']].map(r=>`<div class="rw"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><h2 class="h1">Propriétaire du bien</h2><div class="card pad row"><span style="font-size:34px">👤</span><div><b>Karim B.</b> ${pill('Certifié Sakan')}<br><small class="muted">Membre depuis 2 ans • 4 biens gérés</small><br><small style="color:var(--g)">⚡ Répond en moins d'1h (98%)</small></div></div>${tip('Le conseil de Sakan','Les studios de ce secteur sont réservés en moins de 48 h. Prépare ton dossier numérique !')}</div><div class="fix sp"><div><b style="font-size:18px">${l.p} DH</b> <small class="muted">/ mois</small><br><small class="pc">Charges incluses</small></div><div class="row"><button class="btn s o" onclick="go('con',${l.id})">📅 Visiter</button><button class="btn s" onclick="go('con',${l.id})">💬 Contacter</button></div></div>`},
con:i=>{const l=L[i],v=S.v;return `<div class="scr">${tb('Contacter Karim B.')}<div class="card pad row"><div style="width:90px">${ph(l,90)}</div><div>${pill('✔ Disponibilité confirmée','g')}<br><b>${l.t}</b><br><small class="muted">${l.loc}</small><div class="price" style="font-size:18px">${l.p} DH <small>/ mois</small></div></div></div><div class="card pad"><div class="sp"><b>📅 Choisir un créneau de visite</b>${pill('Étape 1/2')}</div><small class="muted">Sans engagement et gratuit</small><div class="seg" style="margin:12px 0"><button class="${v.site?'on':''}" onclick="S.v.site=1;render(1)">📍 Visite sur place</button><button class="${v.site?'':'on'}" onclick="S.v.site=0;render(1)">🎥 Vidéo guidée</button></div><b>Date disponible</b><div class="row" style="margin:8px 0 14px">${D.map((d,k)=>`<button class="day ${v.d==k?'on':''}" onclick="S.v.d=${k};render(1)"><small>${d[0]}</small><b style="font-size:17px">${d[1]}</b><small>${d[2]}</small></button>`).join('')}</div><b>Heure souhaitée</b><div class="row" style="margin-top:8px">${H.map((h,k)=>`<button class="day ${v.h==k?'on':''}" style="padding:12px 0" onclick="S.v.h=${k};render(1)"><b>${h}</b></button>`).join('')}</div></div><div class="card pad"><div class="sp"><b>💬 Message pour Karim</b><small style="color:var(--g)">🔒 Chiffré Sakan</small></div><div class="row" style="flex-wrap:wrap;margin:8px 0">${CH.map((c,k)=>`<button class="chip" onclick="S.mt+=' '+CH[${k}]+'.';render(1)">+ ${c}</button>`).join('')}</div><textarea rows="5" maxlength="500" oninput="S.mt=this.value">${S.mt}</textarea></div>${tip('Garantie Transparence Sakan','Zéro frais cachés. Aucun versement préalable n\'est requis avant la visite.')}<div class="fix"><button class="btn" onclick="go('ok',${i})">➤ Envoyer la demande & Réserver le créneau</button></div></div>`},
ok:i=>{const l=L[i],v=S.v;return `<div class="scr"><div class="sp">${logo}<button class="bk" onclick="root('home')">✕</button></div>${mas('✅')}<h1 class="c" style="font-size:26px">Demande envoyée !</h1><p class="c muted">Votre visite est réservée avec Karim</p><p class="c" style="margin:10px 0">${pill('● En attente de confirmation du propriétaire','o')}</p><div class="card pad"><div class="row"><div style="width:64px">${ph(l,64)}</div><div style="flex:1">${pill('Studio Meublé')}<br><b>${l.t}</b></div><b class="pc">${l.p}<br><small>DH/mois</small></b></div><div class="grid" style="margin-top:12px"><div class="kv" style="display:block"><div><small>Date & Heure</small><b>${D[v.d][3]} ${D[v.d][1]}</b><br><small class="pc">${H[v.h]} (Créneau réservé)</small></div></div><div class="kv" style="display:block"><div><small>Format de visite</small><b>${v.site?'Visite sur place':'Vidéo guidée'}</b><br><small>Durée estimée : 20 min</small></div></div></div><p style="background:#E5F6EE;color:var(--g);font-weight:700;font-size:13px;border-radius:10px;padding:10px;margin-top:10px">🛡 Dossier locatif 100% complet partagé</p></div>${tip('Garantie de Sérénité Sakan','Le propriétaire s\'engage à vous répondre sous 2 heures. Zéro avance de frais avant la signature du bail.')}<b>PROCHAINES ÉTAPES</b><p style="margin:8px 0">① Karim confirme la disponibilité du créneau.</p><p style="margin-bottom:14px">② Rendez-vous sur place à l'adresse du logement.</p><button class="btn" onclick="S.msgs.length||initChat(${i});go('chat',${i})">💬 Accéder à la messagerie</button><div style="height:10px"></div><button class="btn o" onclick="alert('Visite ajoutée au calendrier')">📅 Ajouter au calendrier</button><p class="c muted" style="margin-top:14px" onclick="root('home')">Retourner à l'accueil</p></div>`},
chat:i=>{const l=L[i];return `<div class="scr" style="padding-bottom:150px"><div class="top"><button class="bk" onclick="back()">←</button><h2>Karim B. ${pill('HÔTE')}<br><small style="color:var(--g);font-weight:400">● En ligne • Répond en 15 min</small></h2><span style="font-size:22px">📞</span></div><div class="card pad row"><div style="width:44px">${ph(l,44)}</div><div style="flex:1"><b>${l.t}</b><br><small class="pc">${l.p} DH /mois</small></div>${pill(D[S.v.d][1]+' '+H[S.v.h],'g')}</div><div class="tip">🔒<small>Garantie Sakan Protection : ne transférez aucun fonds d'acompte avant la visite physique des lieux.</small></div>${S.msgs.map(m=>`<div class="msg ${m[0]?'me':'th'}">${m[1]}<small>${m[2]}${m[0]?' ✓✓':''}</small></div>`).join('')}<div class="card pad" style="max-width:78%"><div class="ph" style="height:60px;background:#F1EEE9;font-size:28px">📍</div><b>${l.loc}</b><br><small class="muted">${l.tr}</small></div></div><div class="fix"><div class="chips">${QR.map((q,k)=>`<button class="chip" onclick="sendMsg(QR[${k}])">${q}</button>`).join('')}</div><div class="row"><input type="text" id="ci" placeholder="Écrivez votre message..." onkeydown="if(event.key==='Enter')sendMsg($('#ci').value)"><button class="btn s" onclick="sendMsg($('#ci').value)">➤</button></div></div>`},
favs:()=>{const f=L.filter(l=>S.favs.has(l.id)),c=L.filter(l=>S.cmp.has(l.id)),sh=S.fl?f:c;return `<div class="scr"><small class="muted">ESPACE RECHERCHE</small><div class="sp"><h1 style="font-size:26px">Favoris (${f.length} logements)</h1><button class="btn s" onclick="go('cmp')">⇄ Comparer</button></div><div class="seg" style="margin:12px 0"><button class="${S.fl?'on':''}" onclick="S.fl=1;render(1)">Tous mes favoris (${f.length})</button><button class="${S.fl?'':'on'}" onclick="S.fl=0;render(1)">Comparateur actif ${c.length}</button></div>${tip('Conseil Sakan','Compare jusqu\'à 4 annonces pour trouver le meilleur compromis loyer/trajet !')}${sh.length?'':'<p class="c muted" style="padding:30px">Rien ici pour le moment.</p>'}${sh.map(l=>`<div class="card"><div class="pw">${ph(l,170)}<div class="tl">${l.v?pill('✔ Vérifié Sakan'):''}${l.i?pill('Disponible immédiatement','g'):''}</div><button class="hrt" onclick="fav(${l.id})">${S.favs.has(l.id)?'💜':'🤍'}</button></div><div class="pd"><div class="sp"><div><h3>${l.t}</h3><small class="muted">${l.loc} • ${l.s} m²</small></div><b class="price" style="font-size:19px">${l.p} DH</b></div><p class="rw" style="margin-top:10px">🚋 ${l.tr}</p><hr><div class="sp"><button onclick="tc(${l.id})"><b>${S.cmp.has(l.id)?'☑':'☐'} Comparer</b></button><button class="btn s" onclick="go('con',${l.id})">Réserver visite</button></div></div></div>`).join('')}<div class="card pad"><div class="sp"><b>📊 Tableau comparatif rapide</b>${pill(c.length+' sélectionnés')}</div>${cmpTable(c.slice(0,2))}<div style="height:12px"></div><button class="btn" onclick="go('cmp')">Ouvrir le comparateur complet →</button></div></div>`},
cmp:()=>{const c=L.filter(l=>S.cmp.has(l.id));return `<div class="scr">${tb('Comparateur')}${c.length?`<div class="card pad" style="overflow-x:auto">${cmpTable(c)}</div>${c.map(l=>`<button class="btn o" style="margin-bottom:8px" onclick="go('con',${l.id})">Réserver visite : ${l.t}</button>`).join('')}`:'<p class="c muted">Sélectionne des logements à comparer.</p>'}</div>`},
prof:()=>`<div class="scr"><div class="card pad"><div class="row"><span style="font-size:52px">👩‍🎓</span><div style="flex:1"><h2>Lina</h2><span class="muted">Étudiant / Jeune actif</span><br>${pill('✔ Dossier vérifié Sakan (100%)')}</div>✏️</div><hr><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[['Dossier','Complet'],['Visites','1 active'],['Alertes','2 ciblées']].map(s=>`<div class="rw" style="display:block;text-align:center"><small class="muted">${s[0]}</small><br><b>${s[1]}</b></div>`).join('')}</div></div><div class="card pad"><div class="sp"><b style="font-size:18px">⚙ Mon profil de recherche</b><b class="pc" onclick="go('fil')">Ajuster</b></div><div class="rw" style="display:block;margin-top:10px"><small class="muted">École / Entreprise ciblée</small><br><b style="color:var(--ink)">Faculté de Médecine et pharmacie</b><br><small>Rayon max 20 min en tramway / marche</small></div><div class="rw" style="display:block"><small class="muted">Budget cible</small><br><b style="font-size:20px">1500 – 2500</b> DH/mois • Charges comprises</div><div class="rw" style="display:block"><small class="muted">Villes & Quartiers</small><br>${pill('Rabat (Al Irfane)','w')} ${pill('Rabat (Agdal)','w')}</div></div><div class="card pad"><div class="sp"><b style="font-size:18px">📁 Mon Dossier Locatif numérique</b>${pill('Prêt à l\'envoi','g')}</div><div style="height:10px"></div>${[['Pièce d\'identité (CNIE marocaine)','Vérifiée et chiffrée'],['Justificatif étudiant / inscription','Année universitaire 2024 - 2025'],['Garant certifié & Justificatif de revenu','Revenu 3× supérieur validé']].map(r=>`<div class="rw"><span><b style="color:var(--ink);font-size:14px">✅ ${r[0]}</b><br><small class="muted">${r[1]}</small></span>👁</div>`).join('')}<button class="btn" onclick="go('dos')">⬆ Télécharger / Mettre à jour mon dossier</button></div><h2 class="h1">Activité récente</h2>${[['📅','Mes visites planifiées','Studio moderne Maarif Extension – Jeudi 16h30'],['🔔','Mes alertes actives','2 alertes configurées (Maarif ≤ 4 500 DH)'],['🕘','Historique de candidatures','3 logements consultés et partagés']].map(a=>`<div class="card pad row"><span style="font-size:24px">${a[0]}</span><div style="flex:1"><b>${a[1]}</b><br><small class="muted">${a[2]}</small></div>›</div>`).join('')}${tip('Besoin d\'aide ? Demande à Sakan !','Ton dossier est prêt à 100%. Je peux t\'aider à débloquer une visite prioritaire en 2 clics !')}<p class="c" style="color:#d33;margin-top:14px" onclick="S.stack=[['onb',0]];render()">⎋ Déconnexion de mon compte</p></div>`,
dos:()=>{const n=S.q?4:3;return `<div class="scr">${tb('Dossier Locatif')}<div class="card pad"><div class="sp">${pill(n==4?'Complet • Prioritaire':'Presque prêt • Prioritaire')}<b class="pc" style="font-size:22px">${n}/4</b></div><h2 style="margin:8px 0">Complété à ${n*25}%</h2><div class="pgb"><div style="width:${n*25}%"></div></div><small class="muted" style="display:block;margin-top:8px">Conseil Sakan : un dossier complet multiplie par 3× tes chances d'obtenir une visite rapide !<br>🔒 Chiffré AES-256 • Conforme CNDP Maroc</small></div><h2 class="h1">Pièces requises</h2>${[['🪪','Pièce d\'identité (CNIE ou Passeport)','CNIE_recto_verso_Lina.pdf (1.8 Mo)','Validé le 12 Mai'],['🎓','Certificat de scolarité ou Contrat','Attestation_Inscription_FMD rabat_2024.pdf','Statut étudiant validé'],['💵','Garant & Justificatif de revenus','3 derniers bulletins de paie (Garant familial)','Solvabilité 3x loyer certifiée']].map(d=>`<div class="card pad row"><span style="font-size:26px">${d[0]}</span><div style="flex:1"><b>${d[1]}</b><br><small class="muted">${d[2]}</small><br>${pill('✓ '+d[3],'g')}</div>👁</div>`).join('')}<div class="card pad" style="border:2px dashed #b9adff;background:${S.q?'#E5F6EE':'#F8F6FF'}"><div class="sp"><b>Quittance précédente ou hébergement</b>${pill('Recommandé','o')}</div><small class="muted">Dernière quittance de loyer ou attestation sur l'honneur</small><div style="height:10px"></div>${S.q?pill('✓ Quittance_loyer.pdf importée','g'):`<div class="card pad c"><div style="font-size:30px">☁️</div><small>Glisse ton fichier ici ou clique pour parcourir<br class="muted">PDF, JPG, PNG (Max. 10 Mo)</small><div class="row" style="margin-top:10px"><button class="btn s" style="flex:1" onclick="S.q=1;render(1)">Importer</button><button class="btn s o" style="flex:1" onclick="S.q=1;render(1)">📷 Scanner</button></div></div>`}</div><div class="card pad"><b>🛡 Protection & Confidentialité Sakan</b><label class="tg"><span><b>Filigrane antivol automatique</b><br><small class="muted">Mention infalsifiable : « Document exclusivement destiné à la location Sakan ».</small></span><input type="checkbox" checked></label><small class="muted">Révélation sécurisée : le propriétaire n'accède à tes pièces complètes qu'une fois le créneau de visite confirmé.</small></div><div class="fix"><button class="btn" onclick="alert('Dossier prioritaire activé ✓');back()">Valider & Activer le dossier prioritaire</button></div></div>`}
};
SC.onb=a=>{const i=a||0,P=[['Trouve ton logement idéal','Des centaines de studios et colocations vérifiés sur le terrain à Casablanca, Rabat et partout au Maroc.','🔍'],['Calcule tes trajets réels','Estime en direct le temps de trajet en tramway, bus et à pied jusqu\'à ton université ou lieu de travail.','➡️'],['Loue en toute sécurité','Zéro arnaque et zéro avance de frais. Visite des logements certifiés avec un dossier 100% protégé.','🛡️']][i];
return `<div class="onb"><div class="sp"><button class="lk" onclick="${i?`S.stack=[['onb',${i-1}]];render()`:''}">${i?'←':''}</button>${i?`<span class="muted">Étape ${i+1} sur 3</span>`:''}<button class="lk" onclick="root('home')">Passer</button></div><div class="mid">${mas(P[2])}<h1>${P[0]}</h1><p>${P[1]}</p>${i==0?`<p style="margin-top:14px">${pill('✓ Prix en DH nets')} ${pill('🛡 Zéro arnaque')}</p>`:''}<div class="dots">${[0,1,2].map(k=>`<i class="${k==i?'on':''}"></i>`).join('')}</div></div><button class="btn" onclick="${i<2?`S.stack=[['onb',${i+1}]];render()`:`root('home')`}">${i<2?'Suivant →':'Commencer l\'expérience →'}</button><p class="c muted" style="margin-top:12px"><small>Déjà un compte ? <b class="pc" onclick="root('home')">Se connecter</b></small></p></div>`};
const MAIN={home:['🏠','Accueil'],search:['🔍','Recherche'],favs:['♡','Favoris'],prof:['👤','Profil']};
function tab(t){root(t)}
function tt(i){const a=S.f.types,t=TYPES[i],k=a.indexOf(t);k<0?a.push(t):a.splice(k,1);render(1)}
function initChat(i){S.msgs=[[1,`Bonjour Karim, j'ai réservé le créneau du ${D[S.v.d][3]} ${D[S.v.d][1]} à ${H[S.v.h]} pour visiter le studio. Mon dossier locatif Sakan est vérifié et complet.`,'10:42'],[0,`Bonjour ! Parfait, le créneau est validé. Je vous attends à ${H[S.v.h]} devant l'immeuble. Avez-vous besoin du lien de localisation exacte ?`,'10:45'],[1,'Oui avec plaisir, merci beaucoup !','10:46']]}
function sendMsg(t){t=(t||'').trim();if(!t)return;S.msgs.push([1,t.replace(/</g,'&lt;'),'maintenant']);render(1);scrollTo(0,document.body.scrollHeight)}
function render(keep){const y=scrollY,[n,a]=cur();$('#app').innerHTML=SC[n](a)+(MAIN[n]?`<div class="nav">${Object.keys(MAIN).map(k=>`<button class="${k==n?'on':''}" onclick="tab('${k}')"><span>${MAIN[k][0]}</span>${MAIN[k][1]}</button>`).join('')}</div>`:'');scrollTo(0,keep?y:0)}
SC.profile=SC.prof;
render();
</script>
</body>
</html>
